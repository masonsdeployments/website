    <rect x="254" y="492" width="72" height="10" rx="5" fill="#c4b5fd" fill-opacity="0.11"/>

    <!-- Bottom Sidebar Card -->
    <rect x="238" y="688" width="142" height="106" rx="16" fill="#17141f" fill-opacity="0.6" stroke="#c4b5fd" stroke-opacity="0.12"/>
