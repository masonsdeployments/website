<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17141d"/>
      <stop offset="55%" stop-color="#1d1827"/>
      <stop offset="100%" stop-color="#131118"/>
    </linearGradient>

    <radialGradient id="glowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1160 190) rotate(138) scale(760 540)">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="52%" stop-color="#8b5cf6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 880) rotate(-25) scale(640 420)">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#c4b5fd" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <linearGradient id="panelSurface" x1="220" y1="180" x2="1380" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2438" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1c1826" stop-opacity="0.72"/>
    </linearGradient>

    <linearGradient id="panelStroke" x1="220" y1="180" x2="1380" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8ccf8" stop-opacity="0.26"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Studio Canvas -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glowTop)"/>
  <rect width="1600" height="1000" fill="url(#glowBottom)"/>

  <!-- Subtle architectural framing guides -->
  <line x1="120" y1="0" x2="120" y2="1000" stroke="#c4b5fd" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="1480" y1="0" x2="1480" y2="1000" stroke="#c4b5fd" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="0" y1="112" x2="1600" y2="112" stroke="#c4b5fd" stroke-opacity="0.07" stroke-width="1"/>
  <line x1="0" y1="888" x2="1600" y2="888" stroke="#c4b5fd" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Main Architectural Product Stage -->
  <g>
    <rect x="200" y="168" width="1200" height="664" rx="28" fill="url(#panelSurface)" stroke="url(#panelStroke)" stroke-width="1.5"/>

